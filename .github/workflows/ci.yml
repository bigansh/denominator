name: validate and build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: validate data
        run: python indexes/teenager-outcomes/validate.py
      - name: build index
        run: python indexes/teenager-outcomes/build.py
      - name: fail if generated output is stale
        run: |
          git diff --exit-code -- site/indexes/teenager-outcomes/toi.json indexes/teenager-outcomes/dist/ \
            || (echo "::error::Generated output is out of date. Run 'python indexes/teenager-outcomes/build.py' and commit the result."; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: teenager-outcomes-index-output
          path: indexes/teenager-outcomes/dist/
